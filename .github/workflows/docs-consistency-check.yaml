name: Docs consistency check

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Run the analysis without opening a PR/issue'
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: docs-consistency-check
  cancel-in-progress: false

jobs:
  analyze:
    runs-on: ubuntu-latest
    # Above analyze.py's 20 min CLI timeout (CLAUDE_TIMEOUT_S)
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Pinned to a specific version to avoid breaking changes in the CLI.
      - name: Install Claude Code CLI
        env:
          CLAUDE_CODE_VERSION: '2.1.282'
        run: |
          npm install -g "@anthropic-ai/claude-code@${CLAUDE_CODE_VERSION}"
          claude --version

      - name: Run analysis
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: python .github/scripts/docs_consistency/analyze.py

      - name: Upload analysis artifact
        uses: actions/upload-artifact@v4
        with:
          name: docs-consistency-analysis
          path: analysis.json

  publish:
    needs: analyze
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Download analysis artifact
        uses: actions/download-artifact@v4
        with:
          name: docs-consistency-analysis

      # Only the default branch may post; scheduled runs always run on it.
      - name: Determine dry-run mode
        id: mode
        env:
          ON_DEFAULT: ${{ github.ref_name == github.event.repository.default_branch }}
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            echo "dry_run=false" >> "$GITHUB_OUTPUT"
          elif [ "$ON_DEFAULT" != "true" ]; then
            echo "dry_run=true" >> "$GITHUB_OUTPUT"
          else
            echo "dry_run=${{ github.event.inputs.dry_run }}" >> "$GITHUB_OUTPUT"
          fi

      # make sure findings already reported in the gaps issue are not reported again
      - name: Fetch findings already reported in the open issues
        id: existing_issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # fetch <label> <file>: write the open issue's body and comments to <file>,
          # print its number (empty if there is no open issue with that label).
          fetch() {
            : > "$2"
            local number
            number=$(gh api "repos/${{ github.repository }}/issues?labels=$1&state=open" \
              --jq '[.[] | select(.pull_request | not)][0].number // empty')
            if [ -n "$number" ]; then
              gh api "repos/${{ github.repository }}/issues/$number" --jq '.body // ""' >> "$2"
              gh api --paginate "repos/${{ github.repository }}/issues/$number/comments" \
                --jq '.[].body' >> "$2"
            fi
            echo "$number"
          }
          echo "inconsistency_number=$(fetch docs-inconsistency existing_inconsistency_issue.md)" >> "$GITHUB_OUTPUT"
          echo "gap_number=$(fetch docs-gaps existing_gap_issue.md)" >> "$GITHUB_OUTPUT"

      - name: Triage findings and apply literal fixes
        id: triage
        run: python .github/scripts/docs_consistency/triage_and_apply.py

      # Against HEAD so staged changes are caught too
      - name: Guard against edits outside docs/
        run: |
          changed=$(git diff --name-only HEAD)
          bad=$(echo "$changed" | grep -v '^docs/' || true)
          if [ -n "$bad" ]; then
            echo "::error::Analysis attempted to modify files outside docs/: $bad"
            exit 1
          fi

      - name: Ensure labels exist
        if: steps.mode.outputs.dry_run != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create docs-consistency --color 0e8a16 --description "Automated docs-vs-code consistency PRs" 2>/dev/null || true
          gh label create docs-gaps --color fbca04 --description "Documentation gaps found by automated check" 2>/dev/null || true
          gh label create docs-inconsistency --color d73a4a --description "Doc/code disagreements needing a human decision" 2>/dev/null || true

      # A PR opened with GITHUB_TOKEN does not trigger CI. It is opened as a draft, so CI starts when a reviewer marks it ready.
      - name: Open pull request
        if: steps.triage.outputs.has_fixes == 'true' && steps.mode.outputs.dry_run != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          existing=$(gh pr list --label docs-consistency --state open --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            echo "PR #$existing is already open and unreviewed — skipping this run's PR." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          branch="docs-consistency/$(date +%Y-%m-%d)"
          git checkout -b "$branch"
          git add docs/
          if git diff --cached --quiet; then
            echo "No doc changes staged despite has_fixes=true; skipping PR." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git commit -m "Automated docs consistency check: $(date +%Y-%m-%d)"
          # persist-credentials is off, so authenticate git for this push only.
          gh auth setup-git
          git push origin "$branch"
          gh pr create --draft --label docs-consistency \
            --title "Docs consistency check: $(date +%Y-%m-%d)" \
            --body-file pr_body.md

      # Inconsistencies that were not auto-fixed: serious ones (the code may be wrong) and
      # minor ones with no safe fix. Gaps go to a separate issue below.
      - name: File or update inconsistencies issue
        if: steps.triage.outputs.has_inconsistency_items == 'true' && steps.mode.outputs.dry_run != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          existing="${{ steps.existing_issue.outputs.inconsistency_number }}"
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body-file inconsistency_issue_body.md
          else
            gh issue create --label docs-inconsistency \
              --title "Doc/code inconsistencies needing a human decision" \
              --body-file inconsistency_issue_body.md
          fi

      - name: File or update gaps issue
        if: steps.triage.outputs.has_gap_items == 'true' && steps.mode.outputs.dry_run != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          existing="${{ steps.existing_issue.outputs.gap_number }}"
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body-file gap_issue_body.md
          else
            gh issue create --label docs-gaps \
              --title "Documentation gaps found by automated check" \
              --body-file gap_issue_body.md
          fi
