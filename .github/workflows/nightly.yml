name: JANUS nightly

on:
  schedule:
    # 03:00 UTC daily.
    - cron: '0 3 * * *'
  # Manual trigger for ad-hoc runs via
  # ``gh workflow run "JANUS nightly" -r <branch>``.
  workflow_dispatch:

# Least-privilege token: only read access to the repo contents.
# Coverage upload uses the CODECOV_TOKEN secret directly, not the
# default GITHUB_TOKEN.
permissions:
  contents: read

# Nightly: full test suite (unit + smoke + integration + slow) with
# coverage instrumentation. The PR gate runs only the unit + smoke
# tiers; the integration and slow tiers run real multi-timestep
# SOCRATES solves. Coverage is reported to the Codecov dashboard via
# codecov-action.
jobs:
  nightly:
    name: JANUS-nightly (ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup system
        run: |
          sudo apt-get update
          sudo apt-get install libnetcdff-dev netcdf-bin

      - name: Get SOCRATES
        uses: actions/checkout@v4
        with:
          repository: 'FormingWorlds/SOCRATES'
          path: 'SOCRATES'

      - uses: actions/cache@v4
        id: cache-socrates
        with:
          path: |
            SOCRATES/bin
            SOCRATES/sbin
            SOCRATES/set_rad_env
          key: socrates-${{ hashFiles('SOCRATES/version') }}

      - name: Build SOCRATES
        if: steps.cache-socrates.outputs.cache-hit != 'true'
        run: |
          export LD_LIBRARY_PATH=""
          cd SOCRATES
          ./configure
          ./build_code
          source set_rad_env
          cd ..

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install JANUS
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[develop]

      # The key carries the directory fwl-io resolves for every dataset the
      # installed fwl-mors declares, plus the checksums its registry pins, so it
      # moves exactly when that data moves. actions/cache writes only on an
      # exact-key miss, so a key that never changes is never rewritten and the
      # tree it holds cannot follow the data.
      - name: Resolve the data cache key
        id: cachekey
        run: python tools/nightly_data_cache.py key

      # The spectral files and stellar spectra are pinned by OSF project ids in
      # src/janus/utils/data.py, which this key does not track. The prefix
      # restore-key seeds a moved key from the previous tree, so they are not
      # refetched alongside a re-pinned dataset.
      - uses: actions/cache@v4
        id: cache-fwl-data
        with:
          path: /home/runner/work/fwl_data
          key: ${{ steps.cachekey.outputs.key }}
          restore-keys: |
            fwl-data-

      # A tree restored on an exact key hit holds what that key was stored
      # under, so anything short of the registry means the two have come apart.
      # A prefix restore is expected to be incomplete and is not checked. Only
      # the manifest-declared datasets are covered, which is what the key spans.
      - name: Check the restored track data
        if: steps.cache-fwl-data.outputs.cache-hit == 'true'
        run: |
          python tools/nightly_data_cache.py check \
            --data-root /home/runner/work/fwl_data

      - name: Run unit + smoke + integration + slow tests with coverage
        run: |
          export FWL_DATA="/home/runner/work/fwl_data"
          export RAD_DIR="/home/runner/work/JANUS/JANUS/SOCRATES"
          source "$RAD_DIR/set_rad_env"
          FULL_FAIL_UNDER=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['tool']['coverage']['report']['fail_under'])")
          echo "Full gate fail_under: ${FULL_FAIL_UNDER}%"
          pytest -m "(unit or smoke or integration or slow) and not skip" \
            --cov=janus \
            --cov-report=term-missing \
            --cov-report=xml \
            --cov-fail-under=${FULL_FAIL_UNDER}

      - name: Upload coverage to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@v6
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: FormingWorlds/JANUS
          files: coverage.xml
          flags: nightly
          fail_ci_if_error: false
